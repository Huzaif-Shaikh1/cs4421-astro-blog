name: Deploy Container to AWS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: an existing ECR image tag to deploy (leave empty to build a new image)'
        required: false
        default: ''

concurrency:
  group: deploy-container
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ROLLBACK_TAG: ${{ github.event.inputs.image_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install dependencies, run unit tests and build the site
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create or update the ECR repository
        working-directory: cdk
        run: npx cdk deploy ContainerRegistryStack --require-approval never

      - name: Log in to Amazon ECR
        if: env.ROLLBACK_TAG == ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        if: env.ROLLBACK_TAG == ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/astro-blog:$IMAGE_TAG .
          docker push $ECR_REGISTRY/astro-blog:$IMAGE_TAG
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag $ECR_REGISTRY/astro-blog:$IMAGE_TAG $ECR_REGISTRY/astro-blog:${{ github.ref_name }}
            docker push $ECR_REGISTRY/astro-blog:${{ github.ref_name }}
          fi

      - name: Deploy to Amazon ECS
        working-directory: cdk
        run: |
          TAG="${ROLLBACK_TAG:-$GITHUB_SHA}"
          echo "Deploying image tag: $TAG"
          npx cdk deploy ContainerServiceStack -c imageTag=$TAG --require-approval never